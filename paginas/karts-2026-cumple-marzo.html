    <script src="script.js"></script>
<script>
            // Función para la descarga
        function descargarArchivo() {
            const lista = document.getElementById('opciones');
            const ruta = lista.value;
            
            const link = document.createElement('a');
            link.href = ruta;
            link.download = ''; // Esto fuerza la descarga
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    // --- LÓGICA DE SEGURIDAD SIMPLIFICADA ---
function verificarAcceso() {
    const urlParams = new URLSearchParams(window.location.search);
    const tokenRecibido = urlParams.get('token');

    // LISTA DE TOKENS PERMITIDOS PARA ESTA PÁGINA
    const tokensValidos = [
        "gf5cl1frzq"/*Oliver*/,
        "b6u734g137"/*Olivia*/,
        "z033kaxa6e"/*Marc*/,
        "3uj4mpgoxy"/*Carlos*/,
        "bt7un9caqt"/*David*/,
        "6zhvns64u5"/*Mario*/,
        "6b9w8qgdro"/*Guillem*/,
        "wimgi44ijh"/*Javier*/,
        "n4g9sw5ajn"/*Iker*/,
        "fjzbmi5ssd"/*Aitor*/,
        "y6x7o4d7e2"/*Esther*/,
        "h9m6g6e2p5"/*Mario2*/,
    ];

    console.log("Token recibido:", tokenRecibido);

    // .includes() comprueba si el token recibido está dentro de nuestra lista
    if (tokensValidos.includes(tokenRecibido)) {
        document.getElementById('todo-el-cumple').style.display = 'block';
        document.getElementById('mensaje-error').style.display = 'none';
        console.log("Acceso concedido con token: " + tokenRecibido);
    } else {
        document.getElementById('mensaje-error').style.display = 'block';
        document.getElementById('todo-el-cumple').style.display = 'none';
        console.error("Token no válido.");
    }
}

    // Ejecutamos la verificación nada más cargar la página
    verificarAcceso();

    // --- TU LÓGICA DE LA GALERÍA ---
    function seleccionar(elemento) {
        document.getElementById('imagenPrincipal').src = elemento.src;
        const todas = document.querySelectorAll('.thumb');
        todas.forEach(t => t.classList.remove('activa'));
        elemento.classList.add('activa');
    }

    // Cargar la barra (al estar en una carpeta, usamos ../ para salir a la principal)
    const barra = document.getElementById('barra');
    fetch('barra.html')
        .then(response => response.text())
        .then(data => {
            barra.innerHTML = data;
        })
        .catch(error => console.error('Error cargando barra.html:', error));
</script>
